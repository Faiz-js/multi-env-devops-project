apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: todo-backend-container
          image: faizjs/todo-backend:v1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: 
                name: backend-configmap