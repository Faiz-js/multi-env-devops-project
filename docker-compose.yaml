version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
    ports:
      - "4173:4173"
    env_file:
      - ./frontend/.env.staging
    environment:
      - NODE_ENV=staging
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.staging
    environment:
      - NODE_ENV=staging
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:1
    ports:
      - "10000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  db:
    image: mysql:9
    ports:
      - "3308:3306"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
