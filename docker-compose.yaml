  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 40s

  cassandra-staging:
    image: cassandra:4.1
    ports:
      - "9043:9042"
    volumes:
      - cassandra-staging-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SHOW HOST'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

