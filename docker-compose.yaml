version: "3.9"

services:
  frontend:
    image: faizjs/todo-frontend:${TAG_NAME} 
    ports:
      - "4173:4173"
    env_file:
      - ./frontend/.env.staging
    environment:
      - NODE_ENV=staging
    depends_on:
      - backend
    restart: always

  backend:
    image: faizjs/todo-backend:${TAG_NAME}
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.staging
    environment:
      - NODE_ENV=staging
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:1
    ports:
      - "10000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  db:
    image: mysql:9
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: staging_password
      MYSQL_DATABASE: todo_application
    volumes:
      - ./schema:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstaging_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

volumes:
  db_data:
